name: minis-demo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-minis_event_demo}
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-minis_demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_PORT:-5434}:5432"
    volumes:
      - minis_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DEMO_POSTGRES_USER:-minis_demo} -d ${DEMO_POSTGRES_DB:-minis_event_demo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${DEMO_MINIO_ROOT_USER:?Set DEMO_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${DEMO_MINIO_ROOT_PASSWORD:?Set DEMO_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DEMO_MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${DEMO_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minis_demo_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend/minis-backend
    restart: unless-stopped
    environment:
     SPRING_PROFILES_ACTIVE: demo
     SERVER_PORT: 8080

     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DEMO_POSTGRES_DB:-minis_event_demo}
     SPRING_DATASOURCE_USERNAME: ${DEMO_POSTGRES_USER:-minis_demo}
     SPRING_DATASOURCE_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}

     FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
     FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?Set FIREBASE_WEB_API_KEY}
     FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:?Set FIREBASE_WEB_AUTH_DOMAIN}
     FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:?Set FIREBASE_WEB_APP_ID}
     FIREBASE_WEB_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:?Set FIREBASE_WEB_STORAGE_BUCKET}

     GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
     MINIS_DEMO_ALLOWED_ORIGINS: ${MINIS_DEMO_ALLOWED_ORIGINS:-http://localhost:8088}
     MINIS_EVENT_ADMIN_BOOTSTRAP_ENABLED: ${MINIS_EVENT_ADMIN_BOOTSTRAP_ENABLED:-false}
     MINIS_EVENT_ADMIN_BOOTSTRAP_FIREBASE_UIDS: ${MINIS_EVENT_ADMIN_BOOTSTRAP_FIREBASE_UIDS:-}

    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS}
        target: /run/secrets/firebase-admin.json
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  proxy:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:?Set FIREBASE_WEB_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:?Set FIREBASE_WEB_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${FIREBASE_WEB_APP_ID:?Set FIREBASE_WEB_APP_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${FIREBASE_WEB_STORAGE_BUCKET:?Set FIREBASE_WEB_STORAGE_BUCKET}
    restart: unless-stopped
    ports:
      - "${DEMO_HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"UP\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minis_demo_postgres_data:
  minis_demo_minio_data:
