spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  level:
    root: INFO
    com.end.minisbackend: INFO
    org.springframework.security: WARN
  structured:
    format:
      console: ecs
    json:
      context:
        include: true
      stacktrace:
        max-length: 8192
        max-throwable-depth: 4

minis:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
  http:
    allowed-origins: ${MINIS_DEMO_ALLOWED_ORIGINS:http://localhost:8088}
  event-admin:
    bootstrap:
      enabled: ${MINIS_EVENT_ADMIN_BOOTSTRAP_ENABLED:false}
      firebase-uids: ${MINIS_EVENT_ADMIN_BOOTSTRAP_FIREBASE_UIDS:}
  content:
    storage:
      internal-endpoint: ${MINIS_CONTENT_STORAGE_INTERNAL_ENDPOINT:http://minio:9000}
      public-endpoint: ${MINIS_CONTENT_STORAGE_PUBLIC_ENDPOINT:http://localhost:${DEMO_MINIO_API_PORT:9002}}
      access-key: ${MINIS_CONTENT_STORAGE_ACCESS_KEY:${DEMO_MINIO_ROOT_USER}}
      secret-key: ${MINIS_CONTENT_STORAGE_SECRET_KEY:${DEMO_MINIO_ROOT_PASSWORD}}
      bucket: ${MINIS_CONTENT_STORAGE_BUCKET:minis-event-media}
      auto-create-bucket: ${MINIS_CONTENT_STORAGE_AUTO_CREATE_BUCKET:false}
