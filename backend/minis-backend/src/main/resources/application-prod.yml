spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  level:
    root: INFO
    com.end.minisbackend: INFO
    org.springframework.security: WARN
  structured:
    format:
      console: ecs
    json:
      context:
        include: true
      stacktrace:
        max-length: 8192
        max-throwable-depth: 4

minis:
  http:
    allowed-origins: ${MINIS_PROD_ALLOWED_ORIGINS:}
