spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  level:
    root: INFO
    com.end.minisbackend: INFO
    org.springframework.security: WARN
  structured:
    format:
      console: ecs
    json:
      context:
        include: true
      stacktrace:
        max-length: 8192
        max-throwable-depth: 4

minis:
  http:
    allowed-origins: ${MINIS_PROD_ALLOWED_ORIGINS:}
  content:
    storage:
      internal-endpoint: ${MINIS_CONTENT_STORAGE_INTERNAL_ENDPOINT:}
      public-endpoint: ${MINIS_CONTENT_STORAGE_PUBLIC_ENDPOINT:}
      access-key: ${MINIS_CONTENT_STORAGE_ACCESS_KEY:}
      secret-key: ${MINIS_CONTENT_STORAGE_SECRET_KEY:}
      bucket: ${MINIS_CONTENT_STORAGE_BUCKET:minis-event-media}
      auto-create-bucket: ${MINIS_CONTENT_STORAGE_AUTO_CREATE_BUCKET:false}
