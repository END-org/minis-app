spring:
  application:
    name: minis-backend

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: MINIS API
    description: Mobile-first mini-film platform backend

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.end.minisbackend: INFO
    org.springframework.security: INFO

minis:
  api:
    version: v1

  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}

    web:
      api-key: ${FIREBASE_WEB_API_KEY:}
      auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
      project-id: ${FIREBASE_PROJECT_ID:}
      app-id: ${FIREBASE_WEB_APP_ID:}
      storage-bucket: ${FIREBASE_WEB_STORAGE_BUCKET:}

  http:
    allowed-origins: []
