spring:
  application:
    name: minis-backend

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,contentStorage

  info:
    env:
      enabled: true

info:
  app:
    name: MINIS API
    description: Mobile-first mini-film platform backend

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.end.minisbackend: INFO
    org.springframework.security: INFO

minis:
  api:
    version: v1

  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}

    web:
      api-key: ${FIREBASE_WEB_API_KEY:}
      auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN:}
      project-id: ${FIREBASE_PROJECT_ID:}
      app-id: ${FIREBASE_WEB_APP_ID:}
      storage-bucket: ${FIREBASE_WEB_STORAGE_BUCKET:}

  http:
    allowed-origins: []

  event-admin:
    bootstrap:
      enabled: ${MINIS_EVENT_ADMIN_BOOTSTRAP_ENABLED:false}
      firebase-uids: ${MINIS_EVENT_ADMIN_BOOTSTRAP_FIREBASE_UIDS:}

  content:
    storage:
      internal-endpoint: ${MINIS_CONTENT_STORAGE_INTERNAL_ENDPOINT:}
      public-endpoint: ${MINIS_CONTENT_STORAGE_PUBLIC_ENDPOINT:}
      access-key: ${MINIS_CONTENT_STORAGE_ACCESS_KEY:}
      secret-key: ${MINIS_CONTENT_STORAGE_SECRET_KEY:}
      bucket: ${MINIS_CONTENT_STORAGE_BUCKET:minis-event-media}
      signed-read-lifetime: ${MINIS_CONTENT_STORAGE_SIGNED_READ_LIFETIME:PT10M}
      connect-timeout: ${MINIS_CONTENT_STORAGE_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${MINIS_CONTENT_STORAGE_READ_TIMEOUT:PT30S}
      write-timeout: ${MINIS_CONTENT_STORAGE_WRITE_TIMEOUT:PT2M}
      auto-create-bucket: ${MINIS_CONTENT_STORAGE_AUTO_CREATE_BUCKET:false}
    importer:
      enabled: ${MINIS_CONTENT_IMPORTER_ENABLED:false}
      manifest-path: ${MINIS_CONTENT_IMPORTER_MANIFEST_PATH:}
      assets-root: ${MINIS_CONTENT_IMPORTER_ASSETS_ROOT:}
      ffprobe-path: ${MINIS_CONTENT_IMPORTER_FFPROBE_PATH:ffprobe}
      probe-timeout: ${MINIS_CONTENT_IMPORTER_PROBE_TIMEOUT:PT10S}
      max-probe-output-bytes: ${MINIS_CONTENT_IMPORTER_MAX_PROBE_OUTPUT_BYTES:1048576}
    reconciliation:
      enabled: ${MINIS_CONTENT_RECONCILIATION_ENABLED:false}
