spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:minis_event_local}
    username: ${POSTGRES_USER:minis}
    password: ${POSTGRES_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${MINIS_SQL_LOGGING:false}
    properties:
      hibernate:
        format_sql: ${MINIS_SQL_FORMAT:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.end.minisbackend: DEBUG
  pattern:
    level: "%5p correlationId=%X{correlationId:-} localUserId=%X{localUserId:-} role=%X{role:-}"

minis:
  http:
    allowed-origins: ${MINIS_LOCAL_ALLOWED_ORIGINS:http://localhost:5173}
  event-admin:
    bootstrap:
      enabled: ${MINIS_EVENT_ADMIN_BOOTSTRAP_ENABLED:false}
      firebase-uids: ${MINIS_EVENT_ADMIN_BOOTSTRAP_FIREBASE_UIDS:}
  content:
    storage:
      internal-endpoint: ${MINIS_CONTENT_STORAGE_INTERNAL_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
      public-endpoint: ${MINIS_CONTENT_STORAGE_PUBLIC_ENDPOINT:http://localhost:${MINIO_API_PORT:9000}}
      access-key: ${MINIS_CONTENT_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:minisadmin}}
      secret-key: ${MINIS_CONTENT_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:change-me-local-minio}}
      bucket: ${MINIS_CONTENT_STORAGE_BUCKET:minis-event-media}
      auto-create-bucket: ${MINIS_CONTENT_STORAGE_AUTO_CREATE_BUCKET:false}
