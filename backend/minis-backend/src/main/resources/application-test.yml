spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///minis_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: minis
    password: minis
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.end.minisbackend: INFO
    org.testcontainers: INFO

minis:
  content:
    storage:
      internal-endpoint: http://127.0.0.1:9000
      public-endpoint: http://127.0.0.1:9000
      access-key: test-access-key
      secret-key: test-secret-key
