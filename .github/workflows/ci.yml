name: MINIS quality gates

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: minis-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend verification
        working-directory: backend/minis-backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/minis-backend/target/surefire-reports/**
            backend/minis-backend/target/failsafe-reports/**
          if-no-files-found: ignore

  frontend-quality-gate:
    name: Frontend event app quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/event-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/event-app
        run: npm ci

      - name: Run frontend lint
        working-directory: web/event-app
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: web/event-app
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: web/event-app
        run: npm run test

      - name: Run frontend production build
        working-directory: web/event-app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-firebase-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_APP_ID: ci-app-id
          VITE_FIREBASE_STORAGE_BUCKET: ci-project.appspot.com
