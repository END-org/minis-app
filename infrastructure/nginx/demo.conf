map $http_x_correlation_id $minis_correlation_id {
  default $http_x_correlation_id;
  "" $request_id;
}

upstream minis_backend {
  server backend:8080;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  client_max_body_size 205m;
  client_body_timeout 120s;
  keepalive_timeout 65s;
  send_timeout 30s;

  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_http_version 1.1;

  add_header X-Correlation-ID $minis_correlation_id always;

  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }
  location = /healthz {
    limit_except GET {
      deny all;
    }

    proxy_pass http://minis_backend/actuator/health/readiness;
    proxy_pass_request_body off;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location /api/ {
    proxy_pass http://minis_backend;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location /auth-test/ {
    proxy_pass http://minis_backend;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location = /swagger-ui.html {
    proxy_pass http://minis_backend;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location /swagger-ui/ {
    proxy_pass http://minis_backend;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location /v3/api-docs {
    proxy_pass http://minis_backend;
    proxy_hide_header X-Correlation-ID;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $minis_correlation_id;
  }

  location /actuator/ {
    return 404;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
